spring.application.name=DreamScope-Backend
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=h2
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
server.port=${SERVER_PORT:8080}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

dreamscope.frontend-url=${FRONTEND_URL:http://localhost:3000}
dreamscope.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://[::1]:3000}
dreamscope.encryption-key=${DREAMSCOPE_ENCRYPTION_KEY:}

resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
